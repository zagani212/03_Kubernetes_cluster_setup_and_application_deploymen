apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.app.label }}
  labels:
    app: {{ .Values.app.label }}
spec:
  serviceName: {{ .Values.app.label }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.label }}
    spec:
      containers:
        - name: {{ .Values.app.label }}
          image: {{ .Values.container.image }}
          ports:
            - name: {{ .Values.app.label }}
              containerPort: {{ .Values.container.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: {{ .Values.container.resources.requests.cpu }}
              memory: {{ .Values.container.resources.requests.memory }}
            limits:
              cpu: {{ .Values.container.resources.limits.cpu }}
              memory: {{ .Values.container.resources.limits.memory }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: {{ .Values.app.label }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.volume.name }}
        resources:
          requests:
            storage: {{ .Values.volume.size }}
