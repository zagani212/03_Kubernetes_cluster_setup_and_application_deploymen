apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.volume.configMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.label }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ .Values.app.title }}</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center;
               background: linear-gradient(145deg, #0f172a, #1e3a5f); color: #e2e8f0; }
        main { text-align: center; padding: 2rem; max-width: 28rem; }
        h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.75rem; color: #38bdf8; }
        p { margin: 0; line-height: 1.6; color: #94a3b8; }
      </style>
    </head>
    <body>
      <main>
        <h1>{{ .Values.app.title }}</h1>
        <p>{{ .Values.app.description }}</p>
      </main>
    </body>
    </html>
