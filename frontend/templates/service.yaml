apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Values.app.label }}
  annotations:
    {{- toYaml .Values.annotations | nindent 6 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.app.label }}
  ports:
    - name: {{ .Values.container.portName }}
      port: {{ .Values.container.port }}
      targetPort: {{ .Values.container.port }}
